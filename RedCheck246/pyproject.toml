[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redcheck"]

[project]
name = "redcheck246"
version = "0.2.0"
description = "Policy-gated, plugin-based security assessment framework"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [
    {name = "SERVER-246", email = "server246@redcheck.dev"},
]

dependencies = [
    "PyYAML>=6.0,<7.0",
    "cryptography>=43.0,<47.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.9,<14.0",
    "structlog>=24.4,<26.0",
    "httpx>=0.27,<1.0",
    "dnspython>=2.7,<3.0",
    "python-whois>=0.9,<1.0",
    "anyio>=4.6,<5.0",
    "argon2-cffi>=23.1,<24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "bandit>=1.8,<2.0",
    "pre-commit>=4.0,<5.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
redcheck = "redcheck.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "UP", "N", "ANN", "ASYNC", "C4", "DTZ", "T20", "PT", "SIM", "TCH"]
ignore = [
    "S101",    # Allow assert in tests
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S106", "S105", "ANN", "D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.mypy.overrides]
module = ["whois.*", "dns.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B110", "B112", "B108", "B501"]
