name: RedCheck246 CI

on:
  push:
    branches: [main, dev/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd RedCheck246
          pip install -e ".[dev]"

      - name: Ruff lint
        run: |
          cd RedCheck246
          ruff check redcheck/ tests/

      - name: Ruff format check
        run: |
          cd RedCheck246
          ruff format --check redcheck/ tests/

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd RedCheck246
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd RedCheck246
          pytest --cov=redcheck --cov-report=term-missing tests/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd RedCheck246
          pip install -e ".[dev]"

      - name: Bandit security scan
        run: |
          cd RedCheck246
          bandit -r redcheck/ -c pyproject.toml -f json -o bandit-report.json || true
          bandit -r redcheck/ -c pyproject.toml

      - name: Secret detection
        run: |
          # Check for potential hardcoded secrets
          echo "Scanning for potential secrets..."
          grep -rn "password\s*=\s*['\"]" RedCheck246/redcheck/ && echo "WARNING: Possible hardcoded passwords found" && exit 1 || echo "No hardcoded passwords detected"
          grep -rn "secret\s*=\s*['\"][^'\"]*['\"]" RedCheck246/redcheck/ | grep -v "test" | grep -v "#" && echo "WARNING: Possible hardcoded secrets found" && exit 1 || echo "No hardcoded secrets detected"

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: |
          cd RedCheck246
          python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: redcheck246-dist
          path: RedCheck246/dist/
