# RedCheck246 — Service Fingerprint Database
# Used by NetworkScanner.detect_service() for banner matching.
# Format: pattern → service name. Patterns are case-insensitive substrings.
# version_group: regex capture group index for version extraction (optional)
# cpe: CPE 2.3 identifier prefix for CVE correlation (optional)

fingerprints:
  # Web servers
  - pattern: "apache"
    service: "Apache HTTP Server"
    category: "web"
    version_group: 1
    cpe: "cpe:2.3:a:apache:http_server"
  - pattern: "nginx"
    service: "Nginx"
    category: "web"
    version_group: 1
    cpe: "cpe:2.3:a:f5:nginx"
