# RedCheck246 — Service Fingerprint Database
# Used by NetworkScanner.detect_service() for banner matching.
# Format: pattern → service name. Patterns are case-insensitive substrings.

fingerprints:
  # Web servers
  - pattern: "apache"
    service: "Apache HTTP Server"
    category: "web"
  - pattern: "nginx"
    service: "Nginx"
    category: "web"
  - pattern: "iis"
    service: "Microsoft IIS"
    category: "web"
  - pattern: "lighttpd"
    service: "Lighttpd"
    category: "web"
  - pattern: "caddy"
    service: "Caddy"
    category: "web"
  - pattern: "litespeed"
    service: "LiteSpeed"
    category: "web"

  # Mail servers
  - pattern: "postfix"
    service: "Postfix SMTP"
    category: "mail"
  - pattern: "exim"
    service: "Exim SMTP"
    category: "mail"
  - pattern: "dovecot"
    service: "Dovecot IMAP/POP3"
    category: "mail"
  - pattern: "sendmail"
    service: "Sendmail"
    category: "mail"

  # SSH
  - pattern: "openssh"
    service: "OpenSSH"
    category: "remote"
  - pattern: "dropbear"
    service: "Dropbear SSH"
    category: "remote"

  # Databases
  - pattern: "mysql"
    service: "MySQL"
    category: "database"
  - pattern: "mariadb"
    service: "MariaDB"
    category: "database"
  - pattern: "postgresql"
    service: "PostgreSQL"
    category: "database"
  - pattern: "redis"
    service: "Redis"
    category: "database"
  - pattern: "mongodb"
    service: "MongoDB"
    category: "database"
  - pattern: "microsoft sql server"
    service: "Microsoft SQL Server"
    category: "database"
  - pattern: "oracle"
    service: "Oracle Database"
    category: "database"

  # FTP
  - pattern: "vsftpd"
    service: "vsftpd"
    category: "file"
  - pattern: "proftpd"
    service: "ProFTPD"
    category: "file"
  - pattern: "pure-ftpd"
    service: "Pure-FTPd"
    category: "file"
  - pattern: "filezilla"
    service: "FileZilla Server"
    category: "file"

  # DNS
  - pattern: "bind"
    service: "ISC BIND"
    category: "dns"
  - pattern: "unbound"
    service: "Unbound DNS"
    category: "dns"
  - pattern: "dnsmasq"
    service: "Dnsmasq"
    category: "dns"

  # Proxies / load balancers
  - pattern: "haproxy"
    service: "HAProxy"
    category: "proxy"
  - pattern: "squid"
    service: "Squid Proxy"
    category: "proxy"
  - pattern: "varnish"
    service: "Varnish Cache"
    category: "proxy"
  - pattern: "envoy"
    service: "Envoy Proxy"
    category: "proxy"

  # Other
  - pattern: "samba"
    service: "Samba SMB"
    category: "file"
  - pattern: "rabbitmq"
    service: "RabbitMQ"
    category: "messaging"
  - pattern: "docker"
    service: "Docker API"
    category: "container"
  - pattern: "kubernetes"
    service: "Kubernetes API"
    category: "container"
  - pattern: "elastic"
    service: "Elasticsearch"
    category: "search"
  - pattern: "tomcat"
    service: "Apache Tomcat"
    category: "web"
  - pattern: "jetty"
    service: "Eclipse Jetty"
    category: "web"

# Well-known port defaults (used when banner detection fails)
port_defaults:
  21: "FTP"
  22: "SSH"
  23: "Telnet"
  25: "SMTP"
  53: "DNS"
  80: "HTTP"
  110: "POP3"
  111: "RPCbind"
  135: "MSRPC"
  139: "NetBIOS"
  143: "IMAP"
  443: "HTTPS"
  445: "SMB"
  465: "SMTPS"
  587: "SMTP Submission"
  993: "IMAPS"
  995: "POP3S"
  1433: "MSSQL"
  1521: "Oracle"
  2049: "NFS"
  3306: "MySQL"
  3389: "RDP"
  5432: "PostgreSQL"
  5672: "AMQP"
  5900: "VNC"
  6379: "Redis"
  8080: "HTTP-Alt"
  8443: "HTTPS-Alt"
  9200: "Elasticsearch"
  9300: "Elasticsearch-Transport"
  11211: "Memcached"
  27017: "MongoDB"
