  25: "SMTP"
  53: "DNS"
  80: "HTTP"
  110: "POP3"
  111: "RPCbind"
  135: "MSRPC"
  139: "NetBIOS"
  143: "IMAP"
  443: "HTTPS"
  445: "SMB"
  465: "SMTPS"
  587: "SMTP Submission"
  993: "IMAPS"
  995: "POP3S"
  1433: "MSSQL"
  1521: "Oracle"
  2049: "NFS"
  3306: "MySQL"
  3389: "RDP"
  5432: "PostgreSQL"
  5672: "AMQP"
  5900: "VNC"
  6379: "Redis"
  8080: "HTTP-Alt"
  8443: "HTTPS-Alt"
  9200: "Elasticsearch"
  9300: "Elasticsearch-Transport"
  11211: "Memcached"
  27017: "MongoDB"
